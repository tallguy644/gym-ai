plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tallguy644.gymai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tallguy644.gymai'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    signingConfigs {
        // Checked-in debug key, so each new prototype build installs over the last one.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// The web bundle comes from `npm run build:android-web` in the repo root.
tasks.register('checkWebBundle') {
    doLast {
        if (!file('src/main/assets/www/app.js').exists()) {
            throw new GradleException('Web bundle missing. Run `npm ci && npm run build:android-web` in the repo root first.')
        }
    }
}
preBuild.dependsOn 'checkWebBundle'
